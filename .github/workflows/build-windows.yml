name: Build CSharp self-contained Windows x64 EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows x64 EXE
        run: dotnet publish GPS_Speed_Analyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GPS_Speed_Analyzer_CSharp_Windows_x64
          path: dist/GPS_Speed_Analyzer.exe
          if-no-files-found: error
