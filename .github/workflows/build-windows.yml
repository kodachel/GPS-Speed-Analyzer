name: Build Windows x64 EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile application and NMEA test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist dist mkdir dist
          cl /nologo /W3 /O2 /MT /std:c17 /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS /Fe:dist\GPS_Speed_Analyzer.exe src\main.c src\nmea.c /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib comdlg32.lib shlwapi.lib shell32.lib ole32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /O2 /MT /std:c17 /D_CRT_SECURE_NO_WARNINGS /Fe:dist\test_nmea.exe tests\test_nmea.c src\nmea.c
          if errorlevel 1 exit /b 1
          dist\test_nmea.exe sample\example.nme
          if errorlevel 1 exit /b 1
      - name: Publish standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: GPS_Speed_Analyzer_Windows_x64
          path: dist/GPS_Speed_Analyzer.exe
          if-no-files-found: error
